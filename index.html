<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Letreiro LED</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#050505">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Letreiro LED">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=VT323&family=Share+Tech+Mono&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:#000;overflow:hidden;}
  #screen{
    position:fixed; top:50%; left:50%; display:flex; align-items:center; justify-content:center;
    text-align:center; overflow:hidden; transition:background .5s ease, color .5s ease;
    font-family:'Share Tech Mono', monospace;
  }
  #screenContent{width:100%; line-height:1.15; word-wrap:break-word; white-space:pre-wrap;}
  #screenSub{display:none !important;}
  #screenMain{
    width:100%;
    text-transform:uppercase;
    letter-spacing:.045em;
    font-variant-numeric:tabular-nums;
  }
  #screen.offline #screenContent{opacity:.35;}

  #rotateBtn{display:none !important;}
</style>
</head>
<body>
<div id="screen">
  <div id="screenContent">
    <div id="screenMain">--:--:--</div>
    <div id="screenSub"></div>
  </div>
</div>
<button id="rotateBtn" aria-label="Girar tela" title="Girar tela">⟳</button>

<script>
/* ===== CONFIGURAÇÃO DO SUPABASE (mesmo projeto do Cloud MGF) ===== */
const SUPABASE_URL = 'https://qwqfmbojxcorupydfgsh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3cWZtYm9qeGNvcnVweWRmZ3NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3NTA4OTgsImV4cCI6MjEwMjMyNjg5OH0.M21WgJZcjzfyhw81Z1Jwh-UyloUha1z8urtPN6qnZPk';
const TABLE = 'letreiro_config';
const ROW_ID = 'main';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const DEFAULT_CONFIG = {
  mode: 'clock', message: 'BEM-VINDO!', bg_color: '#050505', font_color: '#ffb000',
  font_family: "'VT323', monospace", font_size: 100, message_duration: 15, show_seconds: true,
  orientation: 'landscape', message_anim: 'none', glow: false,
  countdown_target: null, countdown_label: '', countdown_end: 'clock',
  schedule_enabled: false, schedule: [], updated_at: null
};

const screenEl = document.getElementById('screen');
const content = document.getElementById('screenContent');
const main = document.getElementById('screenMain');
const sub = document.getElementById('screenSub');

let clockTimer = null, revertTimer = null, currentCfg = DEFAULT_CONFIG;

/* ===== AJUSTE AUTOMÁTICO: o texto sempre ocupa a tela inteira ===== */
const measureCanvas = document.createElement('canvas');
const measureCtx = measureCanvas.getContext('2d');

function widestLineWidth(text, fontPx, fontFamily){
  measureCtx.font = `700 ${fontPx}px ${fontFamily}`;
  const lines = String(text || ' ').split('\n');
  return Math.max(...lines.map(l => measureCtx.measureText(l || ' ').width), 1);
}

function fitDisplay(){
  const family = currentCfg.font_family;
  const innerW = screenEl.clientWidth * 0.96;
  const innerH = screenEl.clientHeight * 0.92;
  const lineCount = String(main.textContent || ' ').split('\n').length;

  const REF = 200;
  const refW = widestLineWidth(main.textContent, REF, family);
  const sizeByWidth = (innerW / refW) * REF;

  const lineHeightFactor = 1.15 * lineCount;
  const sizeByHeight = innerH / lineHeightFactor;

  const scale = (currentCfg.font_size || 100) / 100;
  const fontPx = Math.max(14, Math.min(sizeByWidth, sizeByHeight) * scale);

  content.style.fontSize = fontPx + 'px';
}

/* ===== ROTAÇÃO ===== */
// ===== ORIENTAÇÃO DEFINITIVA =====
// Nunca usamos uma rotação salva no localStorage: ela poderia ficar presa em 90°
// e deixar o desktop deitado. A orientação visual é decidida pelo viewport atual.
let rotation = 0;

function applyRotation(){
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const portrait = vh > vw;

  // Desktop/tablet/celular já em paisagem: NÃO gira.
  // Celular em retrato: gira somente o painel visual para formar uma tela 16:9.
  rotation = portrait ? 90 : 0;

  if(rotation === 90){
    screenEl.style.width = vh + 'px';
    screenEl.style.height = vw + 'px';
    screenEl.style.transform = 'translate(-50%, -50%) rotate(90deg)';
  } else {
    screenEl.style.width = vw + 'px';
    screenEl.style.height = vh + 'px';
    screenEl.style.transform = 'translate(-50%, -50%)';
  }

  refitCurrent();
}

function syncOrientation(cfg){
  // A orientação física deve ser paisagem. O bloqueio é uma melhoria quando
  // o navegador permite; a renderização visual continua funcionando sem ele.
  applyRotation();
  try{
    if(screen.orientation && screen.orientation.lock){
      screen.orientation.lock('landscape').catch(()=>{});
    }
  }catch(e){}
}

function styleScreen(cfg){
  screenEl.style.background = cfg.bg_color;
  screenEl.style.color = cfg.font_color;
  screenEl.style.fontFamily = cfg.font_family;
  if(cfg.glow){
    content.style.textShadow = '0 0 .08em currentColor, 0 0 .22em currentColor';
    content.style.filter = 'drop-shadow(0 0 3px currentColor)';
  } else {
    content.style.textShadow = 'none';
    content.style.filter = 'none';
  }
}

function tickClock(){
  const now = new Date();
  // O letreiro mostra SOMENTE hora e minuto. Nunca exibe data, dia ou mês.
  const opts = {hour:'2-digit', minute:'2-digit', hour12:false};
  main.textContent = now.toLocaleTimeString('pt-BR', opts);
  sub.textContent = '';
  fitDisplay();
}

let activeAnim = null;
function stopAnim(){
  if(activeAnim){ activeAnim.cancel(); activeAnim = null; }
  content.style.position = '';
  content.style.top = '';
  content.style.left = '';
  content.style.width = '';
  content.style.whiteSpace = '';
  content.style.transform = '';
}

function showClock(){
  stopAnim();
  clearInterval(clockTimer);
  tickClock();
  clockTimer = setInterval(tickClock, 1000);
}

function formatCountdownParts(cfg){
  if(!cfg.countdown_target) return null;
  const target = new Date(cfg.countdown_target).getTime();
  if(isNaN(target)) return null;
  const diff = target - Date.now();
  if(diff <= 0){
    if(cfg.countdown_end === 'zeros') return '0:00';
    return 'DONE';
  }
  const totalSec = Math.floor(diff / 1000);
  const d = Math.floor(totalSec / 86400);
  const h = Math.floor((totalSec % 86400) / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const pad2n = n => String(n).padStart(2, '0');
  if(d > 0) return `${d}:${pad2n(h)}:${pad2n(m)}:${pad2n(s)}`;
  if(h > 0) return `${h}:${pad2n(m)}:${pad2n(s)}`;
  return `${m}:${pad2n(s)}`;
}

function tickCountdown(){
  const body = formatCountdownParts(currentCfg);
  if(body === 'DONE'){ showClock(); return; }
  main.textContent = body || '0:00';
  sub.textContent = '';
  fitDisplay();
}

function showCountdown(){
  stopAnim();
  clearInterval(clockTimer);
  tickCountdown();
  clockTimer = setInterval(tickCountdown, 1000);
}

function playScroll(direction){
  const family = currentCfg.font_family;
  const innerH = screenEl.clientHeight * 0.8;
  const scale = (currentCfg.font_size || 100) / 100;
  const fontPx = Math.max(14, (innerH / 1.15) * scale);
  content.style.fontSize = fontPx + 'px';
  content.style.whiteSpace = 'nowrap';
  content.style.position = 'absolute';
  content.style.top = '50%';
  content.style.left = '0';
  content.style.width = 'max-content';

  const textWidth = widestLineWidth(main.textContent, fontPx, family);
  const screenW = screenEl.clientWidth;
  const distance = textWidth + screenW;
  const speedPxPerSec = 130;
  const duration = Math.max(4000, (distance / speedPxPerSec) * 1000);

  const startX = direction === 'scroll-left' ? screenW : -textWidth;
  const endX = direction === 'scroll-left' ? -textWidth : screenW;

  activeAnim = content.animate(
    [
      {transform: `translateY(-50%) translateX(${startX}px)`},
      {transform: `translateY(-50%) translateX(${endX}px)`}
    ],
    {duration, iterations: Infinity, easing: 'linear'}
  );
}

function playVertical(direction){
  fitDisplay();
  content.style.position = 'relative';
  const travel = screenEl.clientHeight * 0.65;
  const from = direction === 'drop' ? -travel : travel;
  activeAnim = content.animate(
    [
      {transform: `translateY(${from}px)`, opacity: 0, offset: 0},
      {transform: 'translateY(0px)', opacity: 1, offset: 0.2},
      {transform: 'translateY(0px)', opacity: 1, offset: 0.8},
      {transform: `translateY(${-from}px)`, opacity: 0, offset: 1}
    ],
    {duration: 5000, iterations: Infinity, easing: 'ease-in-out'}
  );
}

function playFade(){
  fitDisplay();
  content.style.position = 'relative';
  activeAnim = content.animate(
    [
      {opacity: 1, offset: 0},
      {opacity: 0.12, offset: 0.5},
      {opacity: 1, offset: 1}
    ],
    {duration: 3000, iterations: Infinity, easing: 'ease-in-out'}
  );
}

function playBlink(){
  fitDisplay();
  content.style.position = 'relative';
  activeAnim = content.animate(
    [
      {opacity: 1, offset: 0},
      {opacity: 1, offset: 0.55},
      {opacity: 0, offset: 0.6},
      {opacity: 0, offset: 0.95},
      {opacity: 1, offset: 1}
    ],
    {duration: 1200, iterations: Infinity, easing: 'steps(1, end)'}
  );
}

function dispatchAnim(anim){
  if(anim === 'scroll-left' || anim === 'scroll-right'){
    playScroll(anim);
  } else if(anim === 'drop' || anim === 'rise'){
    playVertical(anim);
  } else if(anim === 'fade'){
    playFade();
  } else if(anim === 'blink'){
    playBlink();
  } else {
    fitDisplay();
  }
}

function refitCurrent(){
  const anim = currentCfg.mode === 'message' ? currentCfg.message_anim : null;
  dispatchAnim(anim);
}

function showMessage(text, anim){
  clearInterval(clockTimer);
  stopAnim();
  sub.textContent = '';
  main.textContent = text || '';
  dispatchAnim(anim);
}

function applyConfig(cfg){
  currentCfg = cfg;
  styleScreen(cfg);
  syncOrientation(cfg);
  clearTimeout(revertTimer);
  if(cfg.mode === 'message'){
    showMessage(cfg.message, cfg.message_anim);
    if(!cfg.__scheduled){
      const updatedAt = cfg.updated_at ? new Date(cfg.updated_at).getTime() : Date.now();
      const elapsedSec = (Date.now() - updatedAt) / 1000;
      const remaining = Math.max(0, (cfg.message_duration || 15) - elapsedSec);
      revertTimer = setTimeout(showClock, remaining * 1000);
    }
  } else if(cfg.mode === 'countdown'){
    showCountdown();
  } else {
    showClock();
  }
}

/* ===== AGENDAMENTO POR HORÁRIO =====
   O admin salva uma lista de horários (schedule) com o modo/mensagem de cada um.
   Cada aparelho decide sozinho, com base na hora local dele, qual é o horário
   ativo agora — sem precisar de nenhum servidor rodando o relógio. */
function pad2(n){ return String(n).padStart(2, '0'); }
function nowTimeStr(){ const d = new Date(); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }

function getActiveScheduleEntry(cfg){
  if(!cfg.schedule_enabled || !Array.isArray(cfg.schedule) || cfg.schedule.length === 0) return null;
  const sorted = cfg.schedule.slice().sort((a, b) => String(a.time).localeCompare(String(b.time)));
  const now = nowTimeStr();
  let active = null;
  for(const item of sorted){ if(item.time <= now) active = item; }
  if(!active) active = sorted[sorted.length - 1]; // antes do 1º horário do dia = ainda vale o último de ontem
  return active;
}

function computeEffective(cfg){
  const entry = getActiveScheduleEntry(cfg);
  if(!entry) return cfg;
  return Object.assign({}, cfg, {
    mode: entry.mode,
    message: entry.mode === 'message' ? (entry.message || '') : cfg.message,
    __scheduled: true
  });
}

let baseCfg = DEFAULT_CONFIG;
let lastEffectiveKey = null;
function refreshEffective(){
  const effective = computeEffective(baseCfg);
  const key = JSON.stringify(effective);
  if(key === lastEffectiveKey) return; // nada mudou — não reinicia a animação em andamento
  lastEffectiveKey = key;
  applyConfig(effective);
}

function normalizeCfg(raw){
  const merged = Object.assign({}, DEFAULT_CONFIG, raw);
  if(!Array.isArray(merged.schedule)) merged.schedule = [];
  if(merged.schedule_enabled == null) merged.schedule_enabled = false;
  return merged;
}

refreshEffective();
setInterval(refreshEffective, 5000); // checa a cada 5s se cruzou algum horário do agendamento

let lastConfigKey = null;
function configKey(cfg){ return JSON.stringify(cfg); }

async function loadInitial(){
  const {data, error} = await sb.from(TABLE).select('*').eq('id', ROW_ID).single();
  if(error || !data){ screenEl.classList.add('offline'); return; }
  screenEl.classList.remove('offline');
  const merged = normalizeCfg(data);
  const key = configKey(merged);
  if(key === lastConfigKey) return; // nada mudou no banco
  lastConfigKey = key;
  baseCfg = merged;
  refreshEffective();
}

function subscribeRealtime(){
  sb.channel('letreiro-display')
    .on('postgres_changes', {event:'*', schema:'public', table:TABLE, filter:`id=eq.${ROW_ID}`}, (payload)=>{
      if(!payload.new) return;
      const merged = normalizeCfg(payload.new);
      const key = configKey(merged);
      if(key === lastConfigKey) return;
      lastConfigKey = key;
      baseCfg = merged;
      refreshEffective();
    })
    .subscribe((status)=>{
      if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') screenEl.classList.add('offline');
      if(status === 'SUBSCRIBED') screenEl.classList.remove('offline');
    });
}

loadInitial();
subscribeRealtime();
// checagem de respaldo a cada 1s — garante que não passe de 1s de atraso mesmo se o realtime falhar
setInterval(loadInitial, 1000);

window.addEventListener('resize', applyRotation);
window.addEventListener('orientationchange', ()=>setTimeout(applyRotation, 80));
applyRotation();

// Primeiro toque: tenta liberar tela cheia e travar em paisagem quando o navegador permitir.
document.addEventListener('click', ()=>{
  try{
    if(document.documentElement.requestFullscreen && !document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(()=>{});
    }
  }catch(e){}
  try{
    if(screen.orientation && screen.orientation.lock){
      screen.orientation.lock('landscape').catch(()=>{});
    }
  }catch(e){}
},{once:true});
</script>
</body>
</html>
