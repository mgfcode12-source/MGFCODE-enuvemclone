<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Letreiro LED</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#050505">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Letreiro LED">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=VT323&family=Share+Tech+Mono&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:#000;}
  #screen{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    padding:4vw; text-align:center; overflow:hidden; transition:background .5s ease, color .5s ease;
    padding-top:calc(4vw + env(safe-area-inset-top,0px));
    padding-bottom:calc(4vw + env(safe-area-inset-bottom,0px));
    font-family:'Share Tech Mono', monospace;
  }
  #screenContent{width:100%; line-height:1.15; word-wrap:break-word; white-space:pre-wrap;
    text-shadow:0 0 .12em currentColor, 0 0 .35em currentColor;
    filter:drop-shadow(0 0 6px currentColor);
  }
  #screenSub{opacity:.55; font-size:.28em; margin-top:.3em; letter-spacing:.05em;}
  #screen.offline #screenContent{opacity:.35;}
</style>
</head>
<body>
<div id="screen">
  <div id="screenContent">
    <div id="screenMain">--:--:--</div>
    <div id="screenSub"></div>
  </div>
</div>

<script>
/* ===== CONFIGURAÇÃO DO SUPABASE (mesmo projeto do Cloud MGF) ===== */
const SUPABASE_URL = 'https://qwqfmbojxcorupydfgsh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3cWZtYm9qeGNvcnVweWRmZ3NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3NTA4OTgsImV4cCI6MjEwMjMyNjg5OH0.M21WgJZcjzfyhw81Z1Jwh-UyloUha1z8urtPN6qnZPk';
const TABLE = 'letreiro_config';
const ROW_ID = 'main';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const DEFAULT_CONFIG = {
  mode: 'clock', message: 'Bem-vindo!', bg_color: '#050505', font_color: '#39ff88',
  font_family: "'Orbitron', sans-serif", font_size: 12, message_duration: 15, show_seconds: true,
  updated_at: null
};

const screen = document.getElementById('screen');
const main = document.getElementById('screenMain');
const sub = document.getElementById('screenSub');

let clockTimer = null, revertTimer = null, currentCfg = DEFAULT_CONFIG;

function styleScreen(cfg){
  screen.style.background = cfg.bg_color;
  screen.style.color = cfg.font_color;
  screen.style.fontFamily = cfg.font_family;
  main.style.fontSize = cfg.font_size + 'vw';
}

function tickClock(){
  const now = new Date();
  const opts = currentCfg.show_seconds
    ? {hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}
    : {hour:'2-digit',minute:'2-digit',hour12:false};
  main.textContent = now.toLocaleTimeString('pt-BR', opts);
  sub.textContent = now.toLocaleDateString('pt-BR', {weekday:'long', day:'2-digit', month:'long'});
}

function showClock(){
  clearInterval(clockTimer);
  tickClock();
  clockTimer = setInterval(tickClock, 1000);
}

function showMessage(text){
  clearInterval(clockTimer);
  sub.textContent = '';
  main.textContent = text || '';
}

function applyConfig(cfg){
  currentCfg = cfg;
  styleScreen(cfg);
  clearTimeout(revertTimer);
  if(cfg.mode === 'message'){
    showMessage(cfg.message);
    const updatedAt = cfg.updated_at ? new Date(cfg.updated_at).getTime() : Date.now();
    const elapsedSec = (Date.now() - updatedAt) / 1000;
    const remaining = Math.max(0, (cfg.message_duration || 15) - elapsedSec);
    revertTimer = setTimeout(showClock, remaining * 1000);
  } else {
    showClock();
  }
}

applyConfig(DEFAULT_CONFIG);

async function loadInitial(){
  const {data, error} = await sb.from(TABLE).select('*').eq('id', ROW_ID).single();
  if(error || !data){ screen.classList.add('offline'); return; }
  applyConfig(Object.assign({}, DEFAULT_CONFIG, data));
}

function subscribeRealtime(){
  sb.channel('letreiro-display')
    .on('postgres_changes', {event:'*', schema:'public', table:TABLE, filter:`id=eq.${ROW_ID}`}, (payload)=>{
      if(payload.new) applyConfig(Object.assign({}, DEFAULT_CONFIG, payload.new));
    })
    .subscribe((status)=>{
      if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') screen.classList.add('offline');
      if(status === 'SUBSCRIBED') screen.classList.remove('offline');
    });
}

loadInitial();
subscribeRealtime();
// nova checagem a cada 30s como respaldo, caso o realtime caia
setInterval(loadInitial, 30000);
</script>
</body>
</html>
