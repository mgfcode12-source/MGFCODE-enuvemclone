<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Letreiro LED</title>
<!-- SUPABASE-COMMS-V3 -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#050505">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Letreiro LED">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=VT323&family=Share+Tech+Mono&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:#000;overflow:hidden;}
  #screen{
    position:fixed; top:50%; left:50%;
    width:100vw; height:100vh;
    transform:translate(-50%,-50%);
    display:flex; align-items:center; justify-content:center;
    text-align:center; overflow:hidden;
    padding:0; margin:0;
    transition:background .5s ease, color .5s ease;
    font-family:'Share Tech Mono', monospace;
  }
  #screenContent{
    width:100%; height:100%; margin:0; padding:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    line-height:1.15; word-wrap:break-word; white-space:pre-wrap;
  }
  #screenSub{opacity:.55; font-size:.28em; margin-top:.3em; letter-spacing:.05em;}
  #screen.offline #screenContent{opacity:.35;}
</style>
</head>
<body>
<div id="screen">
  <div id="screenContent">
    <div id="screenMain">--:--:--</div>
    <div id="screenSub"></div>
  </div>
</div>

<script>
/* ===== CONFIGURAÇÃO DO SUPABASE (mesmo projeto do Cloud MGF) ===== */
const SUPABASE_URL = 'https://qwqfmbojxcorupydfgsh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3cWZtYm9qeGNvcnVweWRmZ3NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3NTA4OTgsImV4cCI6MjEwMjMyNjg5OH0.M21WgJZcjzfyhw81Z1Jwh-UyloUha1z8urtPN6qnZPk';
const TABLE = 'letreiro_config';
const ROW_ID = 'main';
const CACHE_KEY = 'letreiroCfgCache';
const RELOAD_KEY = 'letreiroReloadToken';

// Se a biblioteca não carregar (sem internet na abertura), o relógio continua funcionando.
const sb = (window.supabase && window.supabase.createClient)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

const DEFAULT_CONFIG = {
  mode: 'clock', message: 'BEM-VINDO!', bg_color: '#050505', font_color: '#ffb000',
  font_family: "'VT323', monospace", font_size: 100, message_duration: 15, show_seconds: true,
  message_anim: 'scroll-left', message_speed: 'normal', glow: false, keep_awake: true,
  countdown_target: null, countdown_label: '', countdown_end: 'clock',
  message_started_at: null, updated_at: null, reload_token: null
};
const SPEEDS = {slow: 70, normal: 130, fast: 220}; // pixels por segundo

const screenEl = document.getElementById('screen');
const content = document.getElementById('screenContent');
const main = document.getElementById('screenMain');
const sub = document.getElementById('screenSub');

let cfg = DEFAULT_CONFIG;          // configuração que está valendo
let baseCfg = DEFAULT_CONFIG;
let currentView = 'clock';         // o que está REALMENTE na tela: clock | message | countdown
let clockTimer = null, revertTimer = null;
let lastConfigKey = null, lastRaw = {};
let lastOk = Date.now();

/* ===== HORA DO SERVIDOR =====
   Usa a hora do servidor (não a do celular) para o relógio, a mensagem e a contagem.
   Assim, um celular com a hora errada não atrapalha nada. */
let timeOffset = 0;
const nowMs = () => Date.now() + timeOffset;

async function syncTime(){
  if(!sb) return;
  try{
    const t0 = Date.now();
    const {data, error} = await sb.rpc('server_now');
    const t1 = Date.now();
    if(error || !data) return;
    const server = new Date(data).getTime();
    if(isNaN(server)) return;
    let off = server - (t0 + t1) / 2;
    if(Math.abs(off) < 1500) off = 0; // diferença pequena: ignora, evita tremer o relógio
    const changed = Math.abs(off - timeOffset) > 1000;
    timeOffset = off;
    if(changed && baseCfg) applyConfig(baseCfg);
  }catch(e){}
}

/* ===== AJUSTE AUTOMÁTICO: o texto sempre ocupa a tela inteira ===== */
const measureCanvas = document.createElement('canvas');
const measureCtx = measureCanvas.getContext('2d');

function widestLineWidth(text, fontPx, fontFamily){
  measureCtx.font = `700 ${fontPx}px ${fontFamily}`;
  const lines = String(text || ' ').split('\n');
  return Math.max(...lines.map(l => measureCtx.measureText(l || ' ').width), 1);
}

function fitDisplay(){
  const family = cfg.font_family;
  const innerW = screenEl.clientWidth * 0.92;
  const innerH = screenEl.clientHeight * 0.82;
  const lineCount = String(main.textContent || ' ').split('\n').length;
  const subExtra = sub.textContent ? 0.42 : 0; // espaço da linha pequena (rótulo)

  const REF = 200;
  const refW = widestLineWidth(main.textContent, REF, family);
  const sizeByWidth = (innerW / refW) * REF;
  const sizeByHeight = innerH / (1.15 * lineCount + subExtra);

  const scale = (cfg.font_size || 100) / 100;
  const fontPx = Math.max(14, Math.min(sizeByWidth, sizeByHeight) * scale);
  content.style.fontSize = fontPx + 'px';
}

/* ===== ORIENTAÇÃO: o letreiro é sempre HORIZONTAL ===== */
let lastDimKey = '';
function applyRotation(force){
  const vw = window.innerWidth, vh = window.innerHeight;
  const portrait = window.matchMedia('(orientation: portrait)').matches;
  const rotate = portrait && window.matchMedia('(max-width: 900px)').matches;
  const dimKey = vw + 'x' + vh + 'x' + rotate;
  if(!force && dimKey === lastDimKey) return; // nada mudou: não reinicia a animação
  lastDimKey = dimKey;

  if(rotate){
    screenEl.style.width = vh + 'px';
    screenEl.style.height = vw + 'px';
    screenEl.style.transform = 'translate(-50%, -50%) rotate(90deg)';
  } else {
    screenEl.style.width = vw + 'px';
    screenEl.style.height = vh + 'px';
    screenEl.style.transform = 'translate(-50%, -50%)';
  }
  refitCurrent();
}

async function requestLandscape(){
  try{
    if(screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
  }catch(e){ /* alguns navegadores só permitem em tela cheia/PWA; o CSS garante o horizontal */ }
}

let lastFont = '';
function styleScreen(c){
  screenEl.style.background = c.bg_color;
  screenEl.style.color = c.font_color;
  screenEl.style.fontFamily = c.font_family;
  if(c.glow){
    content.style.textShadow = '0 0 .08em currentColor, 0 0 .22em currentColor';
    content.style.filter = 'drop-shadow(0 0 3px currentColor)';
  } else {
    content.style.textShadow = 'none';
    content.style.filter = 'none';
  }
  // Mede de novo quando a fonte terminar de carregar (senão o tamanho sai errado)
  if(c.font_family !== lastFont){
    lastFont = c.font_family;
    if(document.fonts && document.fonts.load){
      document.fonts.load(`700 40px ${c.font_family}`).then(() => refitCurrent()).catch(() => {});
    }
  }
}

/* ===== ANIMAÇÕES ===== */
let activeAnim = null;
function stopAnim(){
  if(activeAnim){ activeAnim.cancel(); activeAnim = null; }
  content.style.position = '';
  content.style.top = '';
  content.style.left = '';
  content.style.width = '';
  content.style.whiteSpace = '';
  content.style.transform = '';
}

function playScroll(direction){
  const family = cfg.font_family;
  const innerH = screenEl.clientHeight * 0.8;
  const scale = (cfg.font_size || 100) / 100;
  const fontPx = Math.max(14, (innerH / 1.15) * scale);
  content.style.fontSize = fontPx + 'px';
  content.style.whiteSpace = 'nowrap';
  content.style.position = 'absolute';
  content.style.top = '50%';
  content.style.left = '0';
  content.style.width = 'max-content';

  const textWidth = widestLineWidth(main.textContent, fontPx, family);
  const screenW = screenEl.clientWidth;
  const speed = SPEEDS[cfg.message_speed] || SPEEDS.normal;
  const duration = Math.max(4000, ((textWidth + screenW) / speed) * 1000);

  const startX = direction === 'scroll-left' ? screenW : -textWidth;
  const endX = direction === 'scroll-left' ? -textWidth : screenW;

  activeAnim = content.animate(
    [
      {transform: `translateY(-50%) translateX(${startX}px)`},
      {transform: `translateY(-50%) translateX(${endX}px)`}
    ],
    {duration, iterations: Infinity, easing: 'linear'}
  );
}

function playVertical(direction){
  fitDisplay();
  content.style.position = 'relative';
  const travel = screenEl.clientHeight * 0.65;
  const from = direction === 'drop' ? -travel : travel;
  activeAnim = content.animate(
    [
      {transform: `translateY(${from}px)`, opacity: 0, offset: 0},
      {transform: 'translateY(0px)', opacity: 1, offset: 0.2},
      {transform: 'translateY(0px)', opacity: 1, offset: 0.8},
      {transform: `translateY(${-from}px)`, opacity: 0, offset: 1}
    ],
    {duration: 5000, iterations: Infinity, easing: 'ease-in-out'}
  );
}

function playFade(){
  fitDisplay();
  content.style.position = 'relative';
  activeAnim = content.animate(
    [{opacity: 1, offset: 0}, {opacity: 0.12, offset: 0.5}, {opacity: 1, offset: 1}],
    {duration: 3000, iterations: Infinity, easing: 'ease-in-out'}
  );
}

function playBlink(){
  fitDisplay();
  content.style.position = 'relative';
  activeAnim = content.animate(
    [
      {opacity: 1, offset: 0}, {opacity: 1, offset: 0.55},
      {opacity: 0, offset: 0.6}, {opacity: 0, offset: 0.95}, {opacity: 1, offset: 1}
    ],
    {duration: 1200, iterations: Infinity, easing: 'steps(1, end)'}
  );
}

// Sempre cancela a animação anterior ANTES de começar outra (evita animação "fantasma")
function dispatchAnim(anim){
  stopAnim();
  if(anim === 'scroll-left' || anim === 'scroll-right') playScroll(anim);
  else if(anim === 'drop' || anim === 'rise') playVertical(anim);
  else if(anim === 'fade') playFade();
  else if(anim === 'blink') playBlink();
  else fitDisplay();
}

// Reajusta o que está na tela AGORA (usa a visão real, não a configuração)
function refitCurrent(){
  dispatchAnim(currentView === 'message' ? cfg.message_anim : null);
}

/* ===== RELÓGIO ===== */
function clockText(){
  const opts = cfg.show_seconds
    ? {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false}
    : {hour:'2-digit', minute:'2-digit', hour12:false};
  return new Date(nowMs()).toLocaleTimeString('pt-BR', opts);
}

function tickClock(){
  const t = clockText();
  if(main.textContent === t) return;
  main.textContent = t;
  sub.textContent = '';
  fitDisplay();
}

function showClock(){
  currentView = 'clock';
  clearTimeout(revertTimer);
  clearInterval(clockTimer);
  stopAnim();
  main.textContent = '';
  sub.textContent = '';
  tickClock();
  clockTimer = setInterval(tickClock, 250);
}

/* ===== CONTAGEM REGRESSIVA ===== */
function countdownBody(c){
  if(!c.countdown_target) return '0:00';
  const target = new Date(c.countdown_target).getTime();
  if(isNaN(target)) return '0:00';
  const diff = target - nowMs();
  if(diff <= 0) return c.countdown_end === 'zeros' ? '0:00' : 'DONE';
  const totalSec = Math.floor(diff / 1000);
  const d = Math.floor(totalSec / 86400);
  const h = Math.floor((totalSec % 86400) / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const p = n => String(n).padStart(2, '0');
  if(d > 0) return `${d}:${p(h)}:${p(m)}:${p(s)}`;
  if(h > 0) return `${h}:${p(m)}:${p(s)}`;
  return `${m}:${p(s)}`;
}

function tickCountdown(){
  const body = countdownBody(cfg);
  if(body === 'DONE'){ showClock(); return; }
  const label = cfg.countdown_label || '';
  if(main.textContent === body && sub.textContent === label) return;
  main.textContent = body;
  sub.textContent = label;
  fitDisplay();
}

function showCountdown(){
  currentView = 'countdown';
  clearTimeout(revertTimer);
  clearInterval(clockTimer);
  stopAnim();
  main.textContent = '';
  sub.textContent = '';
  tickCountdown();
  if(currentView === 'countdown') clockTimer = setInterval(tickCountdown, 250);
}

/* ===== MENSAGEM ===== */
function showMessage(text, anim){
  currentView = 'message';
  clearInterval(clockTimer);
  sub.textContent = '';
  main.textContent = text || '';
  dispatchAnim(anim);
}

/* ===== APLICAR CONFIGURAÇÃO ===== */
function applyConfig(c){
  cfg = c;
  styleScreen(c);
  clearTimeout(revertTimer);
  keepScreenAwake();

  if(c.mode === 'message'){
    // O tempo da mensagem conta a partir de quando ela foi enviada (hora do servidor)
    const started = new Date(c.message_started_at || c.updated_at || 0).getTime();
    const elapsed = (!started || isNaN(started)) ? 0 : (nowMs() - started) / 1000;
    const remaining = (c.message_duration || 15) - elapsed;
    if(remaining <= 0){ showClock(); return; }
    showMessage(c.message, c.message_anim);
    revertTimer = setTimeout(showClock, remaining * 1000);
  } else if(c.mode === 'countdown'){
    showCountdown();
  } else {
    showClock();
  }
}

function normalizeCfg(raw){
  const m = Object.assign({}, DEFAULT_CONFIG, raw);
  const nullable = ['countdown_target', 'message_started_at', 'updated_at', 'reload_token'];
  Object.keys(DEFAULT_CONFIG).forEach(k => {
    if(m[k] == null && nullable.indexOf(k) < 0) m[k] = DEFAULT_CONFIG[k];
  });
  m.font_size = Math.max(20, Math.min(100, Number(m.font_size) || 100));
  return m;
}

// Chave de comparação: ignora reload_token e updated_at (não mudam o que aparece)
function configKey(c){
  const copy = Object.assign({}, c);
  delete copy.reload_token; delete copy.updated_at;
  return JSON.stringify(copy);
}

/* ===== COMANDO "RECARREGAR TELAS" ===== */
let memReloadToken = null;
function checkReload(token){
  if(!token) return;
  let seen = null;
  try{ seen = localStorage.getItem(RELOAD_KEY); }catch(e){ seen = memReloadToken; }
  if(seen === null){ // primeira vez: só memoriza, não recarrega
    try{ localStorage.setItem(RELOAD_KEY, token); }catch(e){}
    memReloadToken = token;
    return;
  }
  if(seen !== token){
    try{ localStorage.setItem(RELOAD_KEY, token); }catch(e){}
    memReloadToken = token;
    location.reload();
  }
}

function ingest(raw){
  lastRaw = Object.assign({}, lastRaw, raw);
  lastOk = Date.now();
  screenEl.classList.remove('offline');
  checkReload(lastRaw.reload_token);
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify(lastRaw)); }catch(e){}
  const merged = normalizeCfg(lastRaw);
  const key = configKey(merged);
  if(key === lastConfigKey) return; // nada mudou: não reinicia a animação
  lastConfigKey = key;
  baseCfg = merged;
  applyConfig(merged);
}

/* ============================================================
   SUPABASE — COMUNICAÇÃO NOVA
   ============================================================

   FONTE ÚNICA DE VERDADE:
       public.letreiro_config / id = main

   FLUXO:
       ADMIN
         ↓
       upsert()
         ↓
       PostgreSQL
         ↓
       Supabase Realtime / postgres_changes
         ↓
       INDEX
         ↓
       ingest()
         ↓
       tela

   Não existe:
   - Broadcast de configuração
   - polling para funcionamento normal
   - sincronização por localStorage
   - Presence para configuração

   O localStorage abaixo serve SOMENTE como cache de inicialização
   offline; ele nunca substitui o banco.
   ============================================================ */

let rtOk = false;
let dbChannel = null;

async function fetchConfig(){
  if(!sb) return false;

  try{
    const {data, error} = await sb
      .from(TABLE)
      .select('*')
      .eq('id', ROW_ID)
      .single();

    if(error) throw error;
    if(!data) return false;

    ingest(data);
    return true;
  }catch(error){
    console.error('[LETREIRO] leitura Supabase:', error);
    return false;
  }
}

function subscribeRealtime(){
  if(!sb) return;

  try{
    /*
      ÚNICA assinatura de configuração.

      O evento UPDATE feito pelo admin chega diretamente aqui.
      Não existe Broadcast intermediário.
    */
    dbChannel = sb
      .channel('letreiro-display-v2')
      .on(
        'postgres_changes',
        {
          event:'*',
          schema:'public',
          table:TABLE,
          filter:`id=eq.${ROW_ID}`
        },
        payload => {
          console.log('[LETREIRO] Realtime recebido:', payload.eventType, payload.new);

          if(payload.new){
            ingest(payload.new);
          }
        }
      )
      .subscribe(async status => {
        console.log('[LETREIRO] Realtime:', status);

        rtOk = status === 'SUBSCRIBED';

        /*
          Assim que a assinatura fica pronta, fazemos UMA leitura.
          Isso cobre uma alteração que tenha ocorrido antes da conexão.
        */
        if(rtOk){
          await fetchConfig();
        }
      });

  }catch(error){
    rtOk = false;
    console.error('[LETREIRO] erro ao conectar Realtime:', error);
  }
}

/*
  Presença é somente para o contador de aparelhos no admin.
  Ela não participa da configuração do letreiro.
*/
function subscribePresence(){
  try{
    const myId =
      (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : String(Math.random()).slice(2) + Date.now();

    const channel = sb.channel('letreiro-presence-v2', {
      config:{presence:{key:myId}}
    });

    channel.subscribe(async status => {
      if(status === 'SUBSCRIBED'){
        try{
          await channel.track({
            type:'display',
            since:Date.now()
          });
        }catch(e){}
      }
    });
  }catch(error){
    console.warn('[LETREIRO] Presence indisponível:', error);
  }
}

/*
  Reconecta o canal se o navegador voltar do modo offline.
*/
async function restartRealtime(){
  try{
    if(dbChannel){
      await sb.removeChannel(dbChannel);
      dbChannel = null;
    }
  }catch(e){}

  rtOk = false;
  subscribeRealtime();
  await fetchConfig();
}

window.addEventListener('online', async () => {
  await syncTime();
  await restartRealtime();
});

/*
  Se a aba ficar visível novamente, garante que o canal e o estado
  continuam vivos.
*/
document.addEventListener('visibilitychange', async () => {
  if(document.visibilityState === 'visible'){
    keepScreenAwake();
    requestLandscape();
    applyRotation();

    if(!rtOk){
      await restartRealtime();
    }else{
      await fetchConfig();
    }
  }
});
/* ===== TELA SEM DESLIGAR (Wake Lock) ===== */
let wakeLock = null;
function releaseWake(){
  if(wakeLock){ wakeLock.release().catch(() => {}); wakeLock = null; }
}
async function keepScreenAwake(){
  if(!('wakeLock' in navigator)) return;
  if(cfg.keep_awake === false){ releaseWake(); return; }
  if(document.visibilityState !== 'visible') return;
  try{
    if(!wakeLock || wakeLock.released){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  }catch(e){}
}

window.addEventListener('resize', () => applyRotation());
window.addEventListener('orientationchange', () => setTimeout(() => { applyRotation(); requestLandscape(); }, 100));
document.addEventListener('pointerdown', keepScreenAwake, {passive:true});

/* ===== INÍCIO ===== */
(function start(){
  applyRotation(true);
  requestLandscape();
  keepScreenAwake();

  // Começa na hora com a última configuração conhecida (funciona até sem internet)
  let started = false;
  try{
    const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if(cached){
      lastRaw = cached;
      const m = normalizeCfg(cached);
      lastConfigKey = configKey(m);
      baseCfg = m;
      applyConfig(m);
      started = true;
    }
  }catch(e){}
  if(!started) applyConfig(DEFAULT_CONFIG);

  if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => refitCurrent());

  if(sb){
    syncTime().then(async () => {
      await fetchConfig();
      subscribeRealtime();
      subscribePresence();
    });
    setInterval(syncTime, 10 * 60 * 1000);
  } else {
    // sem biblioteca (sem internet na abertura): tenta de novo quando a internet voltar
    setInterval(() => { if(navigator.onLine) location.reload(); }, 60000);
  }

  // Manutenção a cada 5 s: sinal de "sem conexão" só depois de 2 min sem resposta
  let beat = 0;
  setInterval(() => {
    beat++;
    screenEl.classList.toggle('offline', sb && (Date.now() - lastOk > 120000));
    if(beat % 12 === 0) keepScreenAwake(); // a cada 1 min reforça a tela ligada
  }, 5000);

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
})();
</script>
</body>
