<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin — Letreiro LED</title>
<meta name="theme-color" content="#15171c">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=VT323&family=Share+Tech+Mono&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{--panel-bg:#15171c;--panel-bg-2:#1c1f26;--line:#2a2e37;--text:#eef0f3;--text-dim:#9aa2b1;--accent:#39ff88;}
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{font-family:'Share Tech Mono', monospace;background:var(--panel-bg);color:var(--text);
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
  #admin{max-width:520px;margin:0 auto;padding:20px 16px 60px;}
  #admin h1{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:800;letter-spacing:.02em;margin:4px 0 2px;color:var(--accent);}
  #admin .sub{color:var(--text-dim);font-size:13px;margin-bottom:20px;}
  .card{background:var(--panel-bg-2);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;}
  .row{margin-bottom:14px;} .row:last-child{margin-bottom:0;}
  label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .seg button{flex:1;padding:10px;background:transparent;color:var(--text-dim);border:none;font-family:inherit;font-size:13px;cursor:pointer;}
  .seg button.on{background:var(--accent);color:#04150a;font-weight:700;}
  textarea,input[type=number],select{width:100%;background:#0f1116;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px;font-family:inherit;font-size:14px;}
  textarea{resize:vertical;min-height:64px;}
  .colorRow{display:flex;gap:10px;} .colorRow > div{flex:1;}
  input[type=color]{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;background:#0f1116;padding:3px;}
  input[type=range]{width:100%;}
  .rangeVal{color:var(--accent);font-size:12px;float:right;}
  .previewBox{border-radius:8px;padding:22px 10px;text-align:center;transition:background .3s,color .3s;overflow:hidden;}
  .previewBox span{text-shadow:0 0 6px currentColor;white-space:pre-wrap;word-wrap:break-word;}
  #saveBtn{width:100%;padding:13px;border:none;border-radius:8px;background:var(--accent);color:#04150a;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer;letter-spacing:.02em;}
  #saveBtn:active{opacity:.85;}
  #status{text-align:center;font-size:12px;color:var(--text-dim);margin-top:10px;min-height:14px;}
  .linkBox{font-size:12px;color:var(--text-dim);word-break:break-all;background:#0f1116;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:6px;}
  .hint{font-size:11px;color:var(--text-dim);margin-top:6px;}
</style>
</head>
<body>
<div id="admin">
  <h1>PAINEL — LETREIRO LED</h1>
  <div class="sub">Configure o que aparece nos celulares que estiverem com o letreiro aberto.</div>

  <div class="card">
    <div class="row">
      <label>Modo</label>
      <div class="seg" id="modeSeg">
        <button data-v="clock">Relógio</button>
        <button data-v="message">Mensagem</button>
      </div>
    </div>
    <div class="row" id="msgRow">
      <label>Mensagem</label>
      <textarea id="message" maxlength="200" placeholder="Digite a mensagem…"></textarea>
    </div>
    <div class="row" id="durRow">
      <label>Duração da mensagem antes de voltar ao relógio (segundos) <span class="rangeVal" id="durVal"></span></label>
      <input type="range" id="messageDuration" min="3" max="120" step="1">
    </div>
    <div class="row" id="secRow">
      <label>Relógio</label>
      <div class="seg" id="secSeg">
        <button data-v="1">Com segundos</button>
        <button data-v="0">Sem segundos</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="row colorRow">
      <div><label>Cor de fundo</label><input type="color" id="bgColor"></div>
      <div><label>Cor da fonte</label><input type="color" id="fontColor"></div>
    </div>
    <div class="row">
      <label>Fonte</label>
      <select id="fontFamily">
        <option value="'Orbitron', sans-serif">Orbitron (display)</option>
        <option value="'VT323', monospace">VT323 (pixel/LED)</option>
        <option value="'Share Tech Mono', monospace">Share Tech Mono</option>
        <option value="'Courier Prime', monospace">Courier Prime</option>
        <option value="Arial, sans-serif">Arial</option>
        <option value="Georgia, serif">Georgia</option>
      </select>
    </div>
    <div class="row">
      <label>Tamanho do texto <span class="rangeVal" id="sizeVal"></span></label>
      <input type="range" id="fontSize" min="4" max="26" step="0.5">
    </div>
  </div>

  <div class="card">
    <label>Prévia</label>
    <div class="previewBox" id="preview"><span id="previewText"></span></div>
  </div>

  <button id="saveBtn">Aplicar nas telas</button>
  <div id="status"></div>

  <div class="card">
    <label>Link do letreiro (abra este nos celulares que serão a tela)</label>
    <div class="linkBox" id="displayLink"></div>
    <div class="hint">Quem abrir esse link só vê o letreiro. Este painel (admin.html) controla todos que estiverem com ele aberto.</div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://qwqfmbojxcorupydfgsh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3cWZtYm9qeGNvcnVweWRmZ3NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3NTA4OTgsImV4cCI6MjEwMjMyNjg5OH0.M21WgJZcjzfyhw81Z1Jwh-UyloUha1z8urtPN6qnZPk';
const TABLE = 'letreiro_config';
const ROW_ID = 'main';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const DEFAULT_CONFIG = {
  mode: 'clock', message: 'Bem-vindo!', bgColor: '#050505', fontColor: '#39ff88',
  fontFamily: "'Orbitron', sans-serif", fontSize: 12, messageDuration: 15, showSeconds: true
};

const el = id => document.getElementById(id);
const state = Object.assign({}, DEFAULT_CONFIG);
let saveTimer = null;
let suppressRemote = false;

el('displayLink').textContent = location.origin + location.pathname.replace(/admin\.html$/, 'index.html');

function setSeg(container, value){
  container.querySelectorAll('button').forEach(b=> b.classList.toggle('on', b.dataset.v === String(value)));
}
function refreshRowVisibility(){
  el('msgRow').style.display = state.mode === 'message' ? '' : 'none';
  el('durRow').style.display = state.mode === 'message' ? '' : 'none';
  el('secRow').style.display = state.mode === 'clock' ? '' : 'none';
}
function renderForm(){
  setSeg(el('modeSeg'), state.mode);
  el('message').value = state.message;
  el('messageDuration').value = state.messageDuration;
  el('durVal').textContent = state.messageDuration + 's';
  setSeg(el('secSeg'), state.showSeconds ? '1' : '0');
  el('bgColor').value = state.bgColor;
  el('fontColor').value = state.fontColor;
  el('fontFamily').value = state.fontFamily;
  el('fontSize').value = state.fontSize;
  el('sizeVal').textContent = state.fontSize + 'vw';
  refreshRowVisibility();
  renderPreview();
}
function renderPreview(){
  const box = el('preview');
  box.style.background = state.bgColor;
  box.style.color = state.fontColor;
  box.style.fontFamily = state.fontFamily;
  const txt = el('previewText');
  txt.style.fontSize = Math.min(state.fontSize, 12) + 'vw';
  txt.textContent = state.mode === 'message' ? (state.message || ' ')
    : new Date().toLocaleTimeString('pt-BR', state.showSeconds ? {hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false} : {hour:'2-digit',minute:'2-digit',hour12:false});
}
function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(commit, 450); }

function toRow(s){
  return {
    id: ROW_ID, mode: s.mode, message: s.message, bg_color: s.bgColor, font_color: s.fontColor,
    font_family: s.fontFamily, font_size: s.fontSize, message_duration: s.messageDuration,
    show_seconds: s.showSeconds, updated_at: new Date().toISOString()
  };
}
function fromRow(r){
  return {
    mode: r.mode, message: r.message, bgColor: r.bg_color, fontColor: r.font_color,
    fontFamily: r.font_family, fontSize: r.font_size, messageDuration: r.message_duration,
    showSeconds: r.show_seconds
  };
}

async function commit(){
  suppressRemote = true;
  const {error} = await sb.from(TABLE).upsert(toRow(state));
  el('status').textContent = error ? 'Falha ao salvar — tente novamente.' : 'Aplicado ✓ ' + new Date().toLocaleTimeString('pt-BR');
  setTimeout(()=>{ suppressRemote = false; }, 800);
}

el('modeSeg').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b)return; state.mode=b.dataset.v; renderForm(); commit(); });
el('secSeg').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b)return; state.showSeconds = b.dataset.v==='1'; renderForm(); scheduleSave(); });
el('message').addEventListener('input', e=>{ state.message = e.target.value; renderPreview(); scheduleSave(); });
el('messageDuration').addEventListener('input', e=>{ state.messageDuration = Number(e.target.value); el('durVal').textContent = state.messageDuration+'s'; scheduleSave(); });
el('bgColor').addEventListener('input', e=>{ state.bgColor = e.target.value; renderPreview(); scheduleSave(); });
el('fontColor').addEventListener('input', e=>{ state.fontColor = e.target.value; renderPreview(); scheduleSave(); });
el('fontFamily').addEventListener('change', e=>{ state.fontFamily = e.target.value; renderPreview(); commit(); });
el('fontSize').addEventListener('input', e=>{ state.fontSize = Number(e.target.value); el('sizeVal').textContent = state.fontSize+'vw'; renderPreview(); scheduleSave(); });
el('saveBtn').addEventListener('click', commit);
setInterval(()=>{ if(state.mode==='clock') renderPreview(); }, 1000);

renderForm();

async function loadInitial(){
  const {data} = await sb.from(TABLE).select('*').eq('id', ROW_ID).single();
  if(data){ Object.assign(state, fromRow(data)); renderForm(); }
}
function subscribeRealtime(){
  sb.channel('letreiro-admin')
    .on('postgres_changes', {event:'*', schema:'public', table:TABLE, filter:`id=eq.${ROW_ID}`}, (payload)=>{
      if(suppressRemote || !payload.new) return;
      Object.assign(state, fromRow(payload.new)); renderForm();
    })
    .subscribe();
}
loadInitial();
subscribeRealtime();
</script>
</body>
</html>
